# AWS Amplify build spec — monorepo form (app lives in frontend/).
# Must live at the REPOSITORY ROOT. Set Amplify monorepo "App root" to `frontend`.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
